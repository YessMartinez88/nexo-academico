<div class="row justify-content-center mt-5">
    <div class="col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-1 text-center">Nexo Académico</h2>
                <p class="text-body-secondary text-center mb-4">Ingresá con tu usuario</p>

                @if (errorMensaje()) {
                    <div class="alert alert-danger" role="alert">{{ errorMensaje() }}</div>
                }

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input
                            id="email"
                            type="email"
                            class="form-control"
                            formControlName="email"
                            autocomplete="username"
                            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                        />
                        <div class="invalid-feedback">Ingresá un email válido.</div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input
                            id="password"
                            type="password"
                            class="form-control"
                            formControlName="password"
                            autocomplete="current-password"
                            [class.is-invalid]="
                                loginForm.get('password')?.invalid && loginForm.get('password')?.touched
                            "
                        />
                        <div class="invalid-feedback">Ingresá la contraseña.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
                        @if (cargando()) {
                            <span class="spinner-border spinner-border-sm me-1" role="status"></span> Ingresando...
                        } @else {
                            Ingresar
                        }
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
